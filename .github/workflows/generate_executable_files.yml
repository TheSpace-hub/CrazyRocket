name: Generate release.
on:
  release:
    types:
      - released

jobs:
  create_executable_file_for_ubuntu:
    name: Create the executable file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the executable file.
        run: ./gradlew lwjgl3:dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: crazyrocket-ubuntu
          path: core/build/libs
  upload_file_to_release:
    name: Upload game to release.
    needs: create_executable_file_for_ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: $GITHUB_TOKEN
    steps:
      - name: Release information output.
        run: echo ::notice::Release version is $GITHUB_REF_NAME
      - name: Download artefact.
        uses: actions/download-artifact@v6
        with:
          name: crazyrocket-ubuntu
      - run: ls
      - name: Update release notes from file.
        run: gh release edit v0.1 --notes-file crazyrocket-ubuntu
