name: Generate release.
on:
  release:
    types:
      - released

jobs:
  create_executable_file_for_ubuntu:
    name: Create the executable file.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: $GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
      - name: Build the executable file.
        run: ./gradlew lwjgl3:dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: crazyrocket-ubuntu
          path: core/build/libs
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: core/build/libs/*.jar
