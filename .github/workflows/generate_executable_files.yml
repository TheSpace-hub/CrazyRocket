name: Generate release.
on: release

jobs:
  create_executable_file_for_ubuntu:
    name: Create the executable file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the executable file.
        run: ./gradlew lwjgl3:dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          path: core/build/libs
  upload_file_to_release:
    name: Upload the file to release
#    needs: create_executable_file_for_ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Copy file
        run: echo You release is $GITHUB_REF
